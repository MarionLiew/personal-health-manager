# Example only. Copy to config/hermes.yaml for a local Hermes deployment.
# Keep local paths and imported records out of Git.
project_root: .
database_path: data/database/health.sqlite3
data_root: data
allowed_import_roots:
  - data/imports
  - data/dicom
  - data/apple_health
# Only add a precise, trusted local attachment cache if required.
allowed_external_import_roots: []
log_level: INFO
default_patient_id: local-primary
max_import_bytes: 1073741824
zip_limits:
  max_files: 10000
  max_uncompressed_bytes: 2147483648
  max_compression_ratio: 200
