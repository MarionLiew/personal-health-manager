version: "1.0.0"
action_levels:
  A: "存在急症信号，建议立即现实就医"
  B: "建议近期就诊，由医生进一步判断"
  C: "按照已有计划复查或复诊"
  D: "记录并观察趋势"
  E: "现有证据不支持新增检查"
evidence_types:
  - user_report
  - source_fact
  - clinician_opinion
  - guideline_rule
  - system_inference
forbidden_score_terms:
  - 总癌症概率
  - 全身癌症风险分
  - 今日癌症风险
  - 免疫力分数
  - 今日免疫力
  - 全身炎症指数
  - 今日炎症指数
  - 总健康分
  - 健康剩余额度
  - 辐射安全余额
  - 免疫力评分
  - 炎症评分
  - 个人癌症概率
  - HPV一定会癌变
fixed_boundaries:
  - 反应性淋巴结不等于淋巴瘤
  - 疼痛不等于癌症侵犯
  - 慢性疼痛不等于慢性炎症
  - 慢性炎症不等于癌前病变
  - 白细胞偏低不等于免疫缺陷
  - 肿瘤标志物正常不能排除所有癌症
  - 肿瘤标志物升高不能直接确诊癌症
  - 单次CRP升高不等于长期系统性炎症
  - 单次HRV下降不能诊断感染或炎症
  - 检查次数多不等于病情严重
  - 三维重建通常属于后处理，不自动代表额外扫描
  - 增强剂本身不产生电离辐射，但多期扫描会增加辐射
  - CTDIvol和DLP不等于患者器官实际吸收剂量
  - 累计有效剂量不能直接换算成个人患癌概率
  - Apple Watch和消费级设备不能诊断癌症或炎症性疾病
  - 消费级体脂秤的单次体脂和肌肉量不是精确测量
  - 瘢痕不应被直接关联为癌症风险
  - HPV相关皮损不等于癌前病变或癌症
  - 不得断言免疫状态变化导致HPV持续或复发
