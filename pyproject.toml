[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "personal-health-agent"
version = "0.6.2"
description = "Local-first personal health risk management and clinical visit assistant"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "personal-health-agent maintainers"}]
dependencies = [
  "alembic>=1.14,<2",
  "click>=8.1,<9",
  "defusedxml>=0.7,<1",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "openpyxl>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydicom>=3.0,<4",
  "pypdf>=5,<7",
  "python-docx>=1.1,<2",
  "python-multipart>=0.0.20",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "typer>=0.15,<1",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
backup = ["cryptography>=44,<47"]

[project.scripts]
health = "health_agent.cli.main:app"
health-web = "health_agent.serve:main"

[tool.hatch.build.targets.wheel]
packages = ["health_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
